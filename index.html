<meta name="theme-color" content="#0e6f6a">
<style>
  :root{
    --line:#1b1f23;
    --paper:#ffffff;
    --bg:#eceeef;
    --muted:#5c5c52;
    --accent:#0e6f6a;
    --accent-soft:#e6f2f1;
    --note:#f5f6f7;
    --good:#0e6f6a;
    --bad:#c4432f;
    --export-green:#1f9d55;
    --import-blue:#1f6fb2;
    --reset-red:#c0392b;
    --nav-home:#0e6f6a;
    --nav-cal:#0e6f6a;
    --nav-stats:#0e6f6a;
    --nav-settings:#0e6f6a;
    --overtime-border:#e0a838;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    font-family: -apple-system, system-ui, sans-serif;
    color:var(--line);
    display:flex;
    justify-content:center;
    padding:28px 12px 60px;
  }
  .device{
    width:380px;
    background:var(--paper);
    border:1px solid #e4e6e9;
    border-radius:32px;
    box-shadow:0 20px 45px -16px rgba(0,0,0,0.28);
    overflow:hidden;
  }
  .notch{
    width:60px;height:5px;background:var(--line);
    border-radius:3px;
    margin:12px auto 0;
    opacity:.25;
  }
  .titlebar{
    text-align:center;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    padding:8px 0 4px;
  }
  .screen{
    min-height:560px;
    max-height:640px;
    overflow-y:auto;
    padding:14px 16px 8px;
  }
  h2{
    font-size:15px;
    letter-spacing:.01em;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
  }
  .backbtn{
    border:none;
    background:var(--note);
    width:34px;height:34px;
    border-radius:50%;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
  }
  .card{
    border:none;
    background:var(--note);
    padding:12px 14px;
    margin-bottom:10px;
    border-radius:14px;
  }
  .card.soft{background:var(--accent-soft);}
  .label{
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    display:block;
    margin-bottom:4px;
    font-weight:600;
  }
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  .field{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    padding:3px 0;
  }
  .field .v{font-weight:700;}
  .v.neg{color:var(--bad);}
  .v.pos{color:var(--good);}
  .neg{color:var(--bad);}
  .pos{color:var(--good);}
  input[type=time], input[type=number], input[type=text]{
    font-family:inherit;
    border:1px solid #e4e6e9;
    border-radius:10px;

<body>

<div class="device">
  <div class="notch"></div>
  <div class="titlebar">Arbeitszeit-App</div>
  <div class="screen" id="screen"></div>
  <div class="nav" id="nav">
    <div data-nav="home">Home</div>

    <div data-nav="settings">Einstellungen</div>
  </div>
</div>

<script>
/* ---------- Helpers ---------- */
const CAT_LABELS = {U:'Urlaub', Z:'Zeitausgleich', K:'Krankenstand', S:'Sonderurlaub', '':''};

function pad(n){return n.toString().padStart(2,'0');}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDstr(s){const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);}
function timeToMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ if(m==null) return ''; m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }
function minToHHMM(m){
  const neg = m<0; m=Math.abs(Math.round(m));
  return (neg?'-':'')+Math.floor(m/60)+':'+pad(m%60);
}
function minToDecimal(m){ return (m/60).toFixed(2).replace('.',','); }
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
function fmtDateLabel(dateStr){
  const d = parseDstr(dateStr);
  return WD[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';
}

/* ---------- Feiertage Österreich (nur Anzeige im Kalender) ---------- */
function easterSunday(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
const _holidayCache = {};
function austrianHolidays(year){
  if(_holidayCache[year]) return _holidayCache[year];
  const easter = easterSunday(year);
  const plus = (n)=>{ const r=new Date(easter); r.setDate(r.getDate()+n); return r; };
  const dates = [
    new Date(year,0,1), new Date(year,0,6),
    plus(1), plus(39), plus(50), plus(60),
    new Date(year,4,1), new Date(year,7,15), new Date(year,9,26),
    new Date(year,10,1), new Date(year,11,8), new Date(year,11,25), new Date(year,11,26)
  ];
  const set = new Set(dates.map(dstr));
  _holidayCache[year] = set;
  return set;
}
function isHoliday(dt){ return austrianHolidays(dt.getFullYear()).has(dstr(dt)); }

/* ---------- State ---------- */
const today = new Date();
const todayStr = dstr(today);

const state = {
  screen: 'home',
  calMonth: today.getMonth(),
  calYear: today.getFullYear(),
  statsTab: 'versp',
  selectedDate: todayStr,
  dayReturnScreen: 'home',
  clockedIn: false,
  settings: {
    monatsSoll: 140*60, tagesSoll: 8*60, urlaubskontingent: 200*60,
    zeitsaldoMitnahme: 0,
    tagesSollHistory: [{ab:'2000-01-01', min:8*60}]
  },
  days: {}
};

/* ---------- Persistente Speicherung (localStorage) ---------- */
const STORAGE_KEY = 'arbeitszeit_app_daten_v1';

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      settings: state.settings,
      days: state.days
    }));
  }catch(err){
    console.error('Speichern fehlgeschlagen', err);
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.days){
      state.settings = Object.assign(state.settings, parsed.settings||{});
      if(!state.settings.tagesSollHistory || !state.settings.tagesSollHistory.length){
        state.settings.tagesSollHistory = [{ab:'2000-01-01', min: state.settings.tagesSoll||480}];
      }
      state.days = parsed.days;

      // Einmalige Migration: alte Mechanismen ("ganzer Tag = Überstunden", automatisch per
      // Bagatellgrenze gezählte Mehrarbeit, sowie das zwischenzeitliche Genehmigungsfeld)
      // werden als manueller Korrekturwert eingefroren, damit sich bereits erfasste
      // Zeitsaldo-Werte durch die neue, rein manuelle Plus-Logik nicht rückwirkend ändern.
      if(!state.settings._migratedManuellerKorrekturwert){
        const oldGrenze = state.settings.bagatellgrenzeMin;
        for(const ds in state.days){
          const d = state.days[ds];
          if(d.manuellerKorrekturwert===undefined) d.manuellerKorrekturwert = null;
          const hasOverride = d.manuellerKorrekturwert!==null && d.manuellerKorrekturwert!==undefined;
          if(!hasOverride && d.kommen && d.gehen){
            const dt = parseDstr(ds);
            const worked = dayWorkedRawMinutes(d);
            const deviation = worked - tagesSollFor(dt);
            if(d.ueberstundenTag){
              d.manuellerKorrekturwert = worked;
            } else if(d.genehmigteUeberstunden>0){
              d.manuellerKorrekturwert = d.genehmigteUeberstunden;
            } else if(deviation>0 && oldGrenze!==undefined && deviation>=oldGrenze){
              d.manuellerKorrekturwert = deviation;
            }
          }
          delete d.ueberstundenTag;
          delete d.genehmigteUeberstunden;
        }
        state.settings._migratedManuellerKorrekturwert = true;
      }

      // Einmalige Migration: manuellerKorrekturwert wurde bisher in Minuten gespeichert,
      // jetzt in Hundertstel-Stunden (siehe dayZeitsaldoContribution) – bestehende Werte umrechnen,
      // damit z.B. ein vorher eingetragenes "3,61" nicht plötzlich als "2,17" gelesen wird.
      if(!state.settings._migratedKorrekturwertHundertstel){
        for(const ds in state.days){
          const d = state.days[ds];
          if(d.manuellerKorrekturwert!==null && d.manuellerKorrekturwert!==undefined){
            d.manuellerKorrekturwert = Math.round(d.manuellerKorrekturwert/60*100);
          }
        }
        state.settings._migratedKorrekturwertHundertstel = true;
      }

      // Einmalige Migration: bestehende Tage mit Kommen/Gehen, die unter dem Tages-Soll liegen
      // und noch keine Kategorie haben, werden automatisch als Zeitausgleich markiert – passend
      // zur neuen Regel, dass unerklärte Minuszeit standardmäßig als Zeitausgleich gilt.
      if(!state.settings._migratedAutoZeitausgleich){
        for(const ds in state.days){
          const d = state.days[ds];
          autoKategorisiereZeitausgleich(d, parseDstr(ds));
        }
        state.settings._migratedAutoZeitausgleich = true;
      }
      return true;
    }
  }catch(err){
    console.error('Laden fehlgeschlagen', err);
  }
  return false;
}

// Gespeicherte Daten laden, falls vorhanden — sonst einmalig Demo-Daten anlegen
const hadSavedData = loadState();
if(!hadSavedData){
  (function seed(){
    function addDay(offset, data){
      const d = new Date(today); d.setDate(d.getDate()+offset);
      state.days[dstr(d)] = Object.assign({
        kommen:null, gehen:null, anfahrt:'', 
        verspHin:{min:0,confirmed:false}, verspRueck:{min:0,confirmed:false},
        kategorie:'', notiz:''
      }, data);
    }
    addDay(-1, {kommen:'08:03', gehen:'16:15', anfahrt:'zug', verspHin:{min:7,confirmed:true}, verspRueck:{min:0,confirmed:false}});
    addDay(-2, {kommen:'07:58', gehen:'16:40', anfahrt:'pkw'});
    addDay(-3, {kommen:'08:10', gehen:'16:20', anfahrt:'zug', verspHin:{min:1,confirmed:true}, verspRueck:{min:12,confirmed:true}});
    addDay(-5, {kategorie:'K', notiz:'Krankenstand'});
    addDay(-7, {kommen:'08:00', gehen:'15:45', anfahrt:'zug', verspHin:{min:0,confirmed:false}, verspRueck:{min:3,confirmed:false}});
    addDay(3, {kategorie:'U'});
    addDay(4, {kategorie:'U'});
    addDay(5, {kategorie:'U'});
    addDay(9, {kategorie:'Z'});
  })();
}

function getDay(dateStr){
  if(!state.days[dateStr]){
    state.days[dateStr] = {
      kommen:null, gehen:null, anfahrt:'',
      verspHin:{min:0,confirmed:false}, verspRueck:{min:0,confirmed:false},
      kategorie:'', notiz:'', pauseMin:0, pauseStart:null,
      manuellerKorrekturwert:null,
      dienstGeplant:false
    };
  }
  return state.days[dateStr];
}

function dayWorkedRawMinutes(d){
  if(!(d.kommen && d.gehen)) return 0;
  const raw = (timeToMin(d.gehen)-timeToMin(d.kommen)) - (d.pauseMin||0);
  return Math.max(0, raw);
}

/* ---------- Computations ---------- */

function monthIstMinutes(y,m){
  let sum=0;
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()===m && d.kommen && d.gehen){
      sum += dayWorkedRawMinutes(d);
    }
  }
  return sum;
}

// Liefert das an diesem Datum gültige Tages-Soll (Minuten) aus der Historie
function tagesSollFor(dt){
  const hist = state.settings.tagesSollHistory;
  if(!hist || !hist.length) return state.settings.tagesSoll||480;
  const ds = dstr(dt);
  let val = hist[0].min;
  for(const entry of hist){
    if(entry.ab <= ds) val = entry.min; else break;
  }
  return val;
}

// Zeitsaldo-Beitrag eines Tages.
// 1) Manueller Korrekturwert (falls gesetzt) ersetzt die Berechnung komplett.
// 2) Reiner Zeitausgleich-Tag (Kategorie "Z", kein Kommen/Gehen): zieht automatisch das
//    volle Tages-Soll vom Zeitsaldo ab – aber erst, sobald der Tag nicht mehr in der Zukunft
//    liegt (wie bei Urlaub wirkt sich reine Vorausplanung noch nicht auf den aktuellen Stand aus).
// 3) Gemischter/Minus-Tag (Kommen/Gehen vorhanden, gearbeitet < Tages-Soll):
//    - Kategorie Urlaub/Krankenstand/Sonderurlaub: Zeitsaldo bleibt unberührt (Defizit läuft nur
//      über die Kategorie, keine Doppelbelastung).
//    - Kategorie Zeitausgleich oder keine Kategorie: Zeitsaldo automatisch im Minus (wie bisher).
// 4) Mehrarbeit (gearbeitet > Tages-Soll) zählt automatisch NICHT (0) – muss manuell gesetzt werden.
function dayZeitsaldoContribution(d, dt){
  if(d.manuellerKorrekturwert !== null && d.manuellerKorrekturwert !== undefined) return Math.round(d.manuellerKorrekturwert/100*60);
  if(!(d.kommen && d.gehen)){
    if(d.kategorie==='Z' && dt<=today) return -tagesSollFor(dt);
    return 0;
  }
  const worked = dayWorkedRawMinutes(d);
  const deviation = worked - tagesSollFor(dt);
  if(deviation<=0 && (d.kategorie==='U' || d.kategorie==='K' || d.kategorie==='S')) return 0;
  return deviation <= 0 ? deviation : 0;
}

// Minus-Tag (gearbeitet < Tages-Soll) ohne jede Kategorie wird automatisch als Zeitausgleich
// markiert – jederzeit änderbar/übersteuerbar, auch rückwirkend. Reine freie Tage ohne
// Kommen/Gehen sind davon NICHT betroffen (die bleiben normale Freizeittage).
function autoKategorisiereZeitausgleich(d, dt){
  if(d.kommen && d.gehen && !d.kategorie){
    const deviation = dayWorkedRawMinutes(d) - tagesSollFor(dt);
    if(deviation < 0) d.kategorie = 'Z';
  }
}

function monthZeitsaldoMinutes(y,m){
  let sum=0;
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()===m){
      sum += dayZeitsaldoContribution(d, dt);
    }
  }
  return sum;
}

/* ---------- Jahres-kumulative Stand/Veränderung-Werte (für Export) ---------- */
function ytdZeitsaldoMinutes(y, uptoM){
  let sum=0;
  for(let m=0;m<=uptoM;m++) sum += monthZeitsaldoMinutes(y,m);
  return sum;
}
function ytdCategoryMinutes(y, uptoM, cat){
  let sum=0;
  for(let m=0;m<=uptoM;m++) sum += monthCategoryMinutes(y,m)[cat];
  return sum;
}
function ytdCategoryMinutesVergangenheit(y, uptoM, cat){
  let sum=0;
  for(let m=0;m<=uptoM;m++) sum += monthCategoryMinutesVergangenheit(y,m)[cat];
  return sum;
}
function ytdPkwTage(y, uptoM){
  let count=0;
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()<=uptoM && d.anfahrt==='pkw') count++;
  }
  return count;
}
function ytdZugverspMinutes(y, uptoM){
  let sum=0;
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()<=uptoM){
      if(d.verspHin && d.verspHin.min>0) sum+=d.verspHin.min;
      if(d.verspRueck && d.verspRueck.min>0) sum+=d.verspRueck.min;
    }
  }
  return sum;
}
// Einzelwerte pro Monat (nicht kumuliert), für das Anfahrt-Diagramm
function monthZugverspMinutes(y,m){
  let sum=0;
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()===m){
      if(d.verspHin && d.verspHin.min>0) sum+=d.verspHin.min;
      if(d.verspRueck && d.verspRueck.min>0) sum+=d.verspRueck.min;
    }
  }
  return sum;
}
function monthPkwTage(y,m){
  let count=0;
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()===m && d.anfahrt==='pkw') count++;
  }
  return count;
}
function svgBarChart(values, color, h){
  const w = 300, n = values.length, barW = w/n, gap = 4;
  const max = Math.max(1, ...values);
  const monthLabels = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  let bars = '';
  values.forEach((v,i)=>{
    const bh = (v/max)*(h-16);
    const x = i*barW + gap/2;
    const y = h - bh - 14;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW-gap).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}"></rect>`;
    bars += `<text x="${(i*barW+barW/2).toFixed(1)}" y="${h-2}" font-size="8" text-anchor="middle" fill="#8a9096">${monthLabels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;">${bars}</svg>`;
}

function ytdUrlaubGeplantMinutes(y, uptoM){
  let sum=0;
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()<=uptoM && d.kategorie==='U' && dt>today){
      sum += categoryCreditForDay(d, dt);
    }
  }
  return sum;
}

// m = -1 bedeutet "Stand vor Jahresbeginn" (= Mitnahme/Jahresbasis, Vergleichswert für Jänner-Veränderung)
function standZeitsaldo(y,m){
  if(m<0) return state.settings.zeitsaldoMitnahme||0;
  return (state.settings.zeitsaldoMitnahme||0) + ytdZeitsaldoMinutes(y,m);
}
// Zukünftig geplante Urlaubstage bleiben unberücksichtigt (nur bereits vergangene Tage zählen)
function standUrlaubRestVergangenheit(y,m){
  if(m<0) return state.settings.urlaubskontingent||0;
  const verbraucht = ytdCategoryMinutes(y,m,'U') - ytdUrlaubGeplantMinutes(y,m);
  return (state.settings.urlaubskontingent||0) - verbraucht;
}
function standKrankenstand(y,m){ return m<0 ? 0 : ytdCategoryMinutesVergangenheit(y,m,'K'); }
function standSonderurlaub(y,m){ return m<0 ? 0 : ytdCategoryMinutesVergangenheit(y,m,'S'); }
function standPkwTage(y,m){ return m<0 ? 0 : ytdPkwTage(y,m); }
function standZugversp(y,m){ return m<0 ? 0 : ytdZugverspMinutes(y,m); }

function categoryCreditForDay(d, dt){
  // Gearbeitete Zeit zählt immer voll als Arbeitszeit (Zeitsaldo), unabhängig von der Kategorie.
  // Die Kategorie bucht nur das verbleibende Defizit zum Tages-Soll (nie negativ).
  const worked = dayWorkedRawMinutes(d);
  return Math.max(0, tagesSollFor(dt) - worked);
}

function monthCategoryMinutes(y,m){
  const out = {U:0,Z:0,K:0,S:0};
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()===m && d.kategorie && out.hasOwnProperty(d.kategorie)){
      out[d.kategorie] += categoryCreditForDay(d, dt);
    }
  }
  return out;
}

function yearCategoryMinutes(y){
  const out = {U:0,Z:0,K:0,S:0};
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && d.kategorie && out.hasOwnProperty(d.kategorie)){
      out[d.kategorie] += categoryCreditForDay(d, dt);
    }
  }
  return out;
}
// Wie monthCategoryMinutes/yearCategoryMinutes, aber zukünftig geplante Tage bleiben unberücksichtigt –
// für alle vier Kategorien einheitlich (nur bereits vergangene/heutige Tage zählen zum aktuellen Stand).
function monthCategoryMinutesVergangenheit(y,m){
  const out = {U:0,Z:0,K:0,S:0};
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt.getMonth()===m && dt<=today && d.kategorie && out.hasOwnProperty(d.kategorie)){
      out[d.kategorie] += categoryCreditForDay(d, dt);
    }
  }
  return out;
}
function yearCategoryMinutesVergangenheit(y){
  const out = {U:0,Z:0,K:0,S:0};
  for(const [ds,d] of Object.entries(state.days)){
    const dt = parseDstr(ds);
    if(dt.getFullYear()===y && dt<=today && d.kategorie && out.hasOwnProperty(d.kategorie)){
      out[d.kategorie] += categoryCreditForDay(d, dt);
    }
  }
  return out;
}

/* ---------- Rendering ---------- */
function setScreen(s){ state.screen = s; render(); }
function openDay(dateStr, returnScreen){
  state.selectedDate = dateStr;
  state.dayReturnScreen = returnScreen || state.screen;
  state.screen = 'day';
  render();
}

function render(){
  saveState();
  document.querySelectorAll('#nav div').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav === state.screen);
  });
  const el = document.getElementById('screen');
  if(state.screen==='home') el.innerHTML = renderHome();
  else if(state.screen==='day') el.innerHTML = renderDay();
  else if(state.screen==='calendar') el.innerHTML = renderCalendar();
  else if(state.screen==='stats') el.innerHTML = renderStats();
  else if(state.screen==='settings') el.innerHTML = renderSettings();
  bindScreenEvents();
}

function renderHome(){
  const t = getDay(todayStr);
  const clockedIn = !!t.kommen && !t.gehen;
  const onPause = clockedIn && !!t.pauseStart;
  let preview = '';
  if(onPause){
    preview = 'In Pause seit <b>'+t.pauseStart+'</b>'+((t.pauseMin||0)>0?' (bisherige Pause heute: '+t.pauseMin+' Min)':'');
  } else if(clockedIn){
    const end = timeToMin(t.kommen) + (t.pauseMin||0) + tagesSollFor(today) + 1;
    preview = 'Heutiges Dienstende: <b>'+minToTime(end)+'</b>';
  } else if(t.kommen && t.gehen){
    preview = 'Heute erfasst: '+t.kommen+' – '+t.gehen+((t.pauseMin||0)>0?' (Pause: '+t.pauseMin+' Min)':'');
  } else {
    preview = 'Noch nicht gestempelt';
  }

  const y = state.calYear, m = new Date().getMonth();
  const arbeitstage = Object.entries(state.days).filter(([ds,dd])=>{
    const dt = parseDstr(ds);
    return dt.getFullYear()===today.getFullYear() && dt.getMonth()===today.getMonth() && dd.kommen && dd.gehen;
  }).length;
  const monatsSaldoVeraenderung = monthZeitsaldoMinutes(today.getFullYear(), today.getMonth());
  const zeitsaldoStand = standZeitsaldo(today.getFullYear(), today.getMonth());
  const urlaubRest = standUrlaubRestVergangenheit(today.getFullYear(), 11);
  const urlaubGeplant = ytdUrlaubGeplantMinutes(today.getFullYear(), 11);

  return `
    <div class="stemp ${clockedIn?'active':''}" id="stempBtn">
      ${clockedIn ? 'GEHEN' : (t.kommen&&t.gehen ? 'ERNEUT<br>KOMMEN' : 'KOMMEN')}
      <small>${clockedIn?'antippen zum Beenden':'antippen zum Starten'}</small>
    </div>
    <div class="status-line">${fmtDateLabel(todayStr)} · ${clockedIn?'im Dienst seit '+t.kommen : (t.kommen&&t.gehen?'Dienst beendet':'nicht im Dienst')}</div>
    ${clockedIn ? `<div class="chip ${onPause?'selected':''}" id="pauseBtn" style="width:100%; text-align:center; box-sizing:border-box; margin-top:6px;">${onPause?'PAUSE BEENDEN':'PAUSE STARTEN'}</div>` : ''}
    <div class="preview">${preview}</div>

    <div class="card">
      <span class="label">Anfahrt heute</span>
      <div class="chips">
        <div class="chip ${t.anfahrt==='pkw'?'selected':''}" data-anfahrt="pkw">PKW</div>
        <div class="chip ${t.anfahrt==='zug'?'selected':''}" data-anfahrt="zug">Zug</div>
      </div>
    </div>

    <div class="card soft">
      <span class="label">Kurzstatus Monat</span>
      <div class="field">Arbeitstage <span class="v">${arbeitstage}</span></div>
      <div class="field">Zeitsaldo (Veränderung) <span class="v"><span class="${signClass(zeitsaldoStand)}">${minToHHMM(zeitsaldoStand)}</span> (<span class="${signClass(monatsSaldoVeraenderung)}">${minToHHMMSigned(monatsSaldoVeraenderung)}</span>)</span></div>
      <div class="field" style="opacity:0.65; font-size:11px;">Zeitsaldo dezimal <span class="v" style="font-size:11px;">${minToDecimal(zeitsaldoStand)} Std</span></div>
      <div class="field">Urlaubsrest (verplant) <span class="v"><span class="${signClass(urlaubRest)}">${minToHHMM(urlaubRest)}</span> (<span class="${signClass(state.settings.urlaubskontingent - (urlaubGeplant+urlaubRest))}">${minToHHMM(urlaubGeplant)}</span>)</span></div>
      <div class="field" style="opacity:0.65; font-size:11px;">Urlaubsrest dezimal <span class="v" style="font-size:11px;">${minToDecimal(urlaubRest)} (<span class="${signClass(state.settings.urlaubskontingent - (urlaubGeplant+urlaubRest))}">${minToDecimal(urlaubGeplant)}</span>) Std</span></div>
    </div>
    <div class="btn-outline" id="gotoToday">Heutigen Tag im Detail bearbeiten →</div>
  `;
}

      <div class="ghost">Reine Markierung für deinen Dienstplan, ohne jede Auswirkung auf Zeitsaldo oder Auswertungen. Verschwindet automatisch, sobald der Tag kein Zukunftstag mehr ist.</div>

function renderCalendar(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7; // Monday-first
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const ds = y+'-'+pad(m+1)+'-'+pad(day);
    const d = state.days[ds];
    const dt = new Date(y,m,day);
    const isToday = ds===todayStr;
    const isFutureDay = dt > today && ds!==todayStr;
    const booked = d && d.kommen && d.gehen;
    const hasKat = !!(d && d.kategorie);
    const isFree = !isFutureDay && !booked && !hasKat;
    const mixed = booked && hasKat;
    const pureKat = !booked && hasKat;
    const hasOvertime = booked && dayZeitsaldoContribution(d, dt) > 0;
    const holiday = isHoliday(dt);
    const dienstGeplant = isFutureDay && d && d.dienstGeplant;
    const hasKorrektur = d && d.manuellerKorrekturwert!==null && d.manuellerKorrekturwert!==undefined;
    // Punkt nur dort informativ, wo der Korrekturwert vom Normalfall abweicht: bei Minderzeit/keiner
    // Arbeitszeit läuft automatisch Minus/0 – wird das überschrieben, ist das eine echte Ausnahme.
    // Bei Mehrarbeit ist der Korrekturwert der ohnehin übliche Weg zu Plusstunden, dort kein Punkt.
    let waereAutomatischNichtPositiv = true;
    if(d && d.kommen && d.gehen){
      const worked = dayWorkedRawMinutes(d);
      waereAutomatischNichtPositiv = (worked - tagesSollFor(dt)) <= 0;
    }
    const manuell = hasKorrektur && waereAutomatischNichtPositiv;
    const catTint = {U:'#dfe6d2', Z:'#d7e2ec', K:'#f0d9d0', S:'#e9d9f0'};
    let styleAttr = '';
    if(mixed) styleAttr = ` style="background:linear-gradient(135deg, #eef3ec 50%, ${catTint[d.kategorie]} 50%);"`;
    else if(pureKat) styleAttr = ` style="background:${catTint[d.kategorie]};"`;
    cells += `<div class="cal-cell ${isToday?'today':''} ${booked&&!mixed?'booked':''} ${isFree?'free':''} ${hasOvertime?'overtime':''} ${holiday?'holiday':''} ${dienstGeplant?'dienstgeplant':''} ${manuell?'manuell':''}" data-day="${ds}"${styleAttr}>${day}</div>`;
  }

  return `
    <h2>Kalender</h2>
    <div class="cal-head">
      <button id="prevMonth">‹</button>
      <div>${monthNames[m]} ${y}</div>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid">
      <div class="cal-wd">Mo</div><div class="cal-wd">Di</div><div class="cal-wd">Mi</div><div class="cal-wd">Do</div><div class="cal-wd">Fr</div><div class="cal-wd">Sa</div><div class="cal-wd">So</div>
      ${cells}
    </div>
    <div class="ghost" style="line-height:1.6;">
      <div style="margin-bottom:6px;">Tag antippen → Tagesdetail.</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px 10px;">
        <div>
          <div><span style="color:#0e6f6a;font-weight:bold;">Türkis</span> = Arbeitstag</div>
          <div><span style="color:#a67c3d;font-weight:bold;">Beige</span> = frei</div>
          <div><span style="color:#5b7fa6;font-weight:bold;">Blau</span> = Zeitausgleich</div>
          <div><span style="color:#7c8c5e;font-weight:bold;">Grün</span> = Urlaub</div>
          <div><span style="color:#b0462f;font-weight:bold;">Rot</span> = Krankenstand</div>
          <div><span style="color:#a97cc9;font-weight:bold;">Lila</span> = Sonderurlaub</div>
        </div>
        <div>
          <div><span style="border:2px solid #d9a441; padding:0 3px; border-radius:2px;">Gelb</span> = Überstunden</div>
          <div><span style="border:1.5px dashed var(--accent); padding:0 3px; border-radius:2px;">Gestrichelt</span> = geplanter Dienst</div>
          <div><span style="display:inline-block;width:0;height:0;border-style:solid;border-width:6px 6px 0 0;border-color:#7d5ba6 transparent transparent transparent;"></span> = Feiertag</div>
          <div>Zweifarbig = gemischt</div>
          <div><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);"></span> = Korrekturwert übersteuert Minus</div>
        </div>
      </div>
    </div>
  `;
}

function renderStats(){
  const y = today.getFullYear(), m = today.getMonth();
  const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  if(state.statsTab==='versp'){
    const zvStand = standZugversp(y,m), zvVer = zvStand - standZugversp(y,m-1);
    const pkwStand = standPkwTage(y,m), pkwVer = pkwStand - standPkwTage(y,m-1);
    const zvSeries = [];
    const pkwSeries = [];
    for(let mi=0; mi<12; mi++){
      zvSeries.push(monthZugverspMinutes(y,mi));
      pkwSeries.push(monthPkwTage(y,mi));
    }
    return `
      <h2>Auswertung</h2>
      <div class="tabs">
        <div class="active" data-tab="versp">Anfahrt</div>
        <div data-tab="saldo">Stunden</div>
      </div>
      <div class="card">
        <div class="field">Zugverspätung <span class="v">${minToHHMM(zvStand)} (${minToHHMMSigned(zvVer)})</span></div>
        <div class="field">PKW <span class="v">${pkwStand} (${pkwVer>0?'+':''}${pkwVer})</span></div>
        <div class="ghost">Jahressumme (Veränderung seit letztem Tag des Vormonats). Vollständig getrennt vom Arbeitszeit-Saldo, reines Protokoll.</div>
      </div>
      <div class="card">
        <span class="label">Zugverspätung — Monatsvergleich ${y}</span>

  } else {

    return `
      <h2>Auswertung</h2>
      <div class="tabs">
        <div data-tab="versp">Anfahrt</div>
        <div class="active" data-tab="saldo">Stunden</div>
      </div>
      <div class="card">
        <span class="label">${monthNames[m]} ${y}</span>
        <div class="field">Gearbeitete Monatsstunden <span class="v">${minToHHMM(ist)} <span style="opacity:0.6;">(${minToHHMM(state.settings.monatsSoll)})</span></span></div>
        <div class="field"><span style="color:#7c8c5e;">Verbrauchter Urlaub</span> <span class="v">${minToHHMM(cats.U)} (${minToHHMM(catsMonat.U)})</span></div>
        <div class="field"><span style="color:#b0462f;">Krankenstand</span> <span class="v">${minToHHMM(cats.K)} (${minToHHMM(catsMonat.K)})</span></div>

        <div class="field"><span style="color:#5b7fa6;">Zeitausgleich</span> <span class="v">${minToHHMM(cats.Z)} (${minToHHMM(catsMonat.Z)})</span></div>
        <div class="ghost">Gearbeitete Monatsstunden: seit Monatsbeginn geleistet, Klammerwert = Monats-Soll (reine Info). Urlaub/Krankenstand/Sonderurlaub/Zeitausgleich: nur bereits vergangene Tage, Klammerwert = davon diesen Monat.</div>
      </div>
    `;
  }
}

function monthOptions(){
  const names = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const out = [];
  let y = today.getFullYear(), m = today.getMonth();
  for(let i=0;i<12;i++){
    out.push({y, m, label: names[m]+' '+y});
    m--; if(m<0){m=11; y--;}
  }
  return out; // neueste zuerst: aktueller Monat + letzte 11
}

/* ---------- Event binding ---------- */
function bindScreenEvents(){
  if(state.screen==='home'){
    document.getElementById('stempBtn').onclick = ()=>{
      const t = getDay(todayStr);
      const nowMin = new Date().getHours()*60+new Date().getMinutes();
      if(t.kommen && !t.gehen){
        if(t.pauseStart){ // offene Pause automatisch schließen, damit sie nicht verloren geht
          t.pauseMin = (t.pauseMin||0) + Math.max(0, nowMin - timeToMin(t.pauseStart));
          t.pauseStart = null;
        }
        t.gehen = minToTime(nowMin);
      } else {
        t.kommen = minToTime(nowMin);
        t.gehen = null;
        t.pauseMin = 0;
        t.pauseStart = null;
      }
      render();
    };
    const pauseBtn = document.getElementById('pauseBtn');
    if(pauseBtn) pauseBtn.onclick = ()=>{
      const t = getDay(todayStr);
      const nowMin = new Date().getHours()*60+new Date().getMinutes();
      if(t.pauseStart){
        t.pauseMin = (t.pauseMin||0) + Math.max(0, nowMin - timeToMin(t.pauseStart));
        t.pauseStart = null;
      } else {
        t.pauseStart = minToTime(nowMin);
      }
      render();
    };
    document.querySelectorAll('[data-anfahrt]').forEach(el=>{
      el.onclick = ()=>{
        const t = getDay(todayStr);
        t.anfahrt = (t.anfahrt===el.dataset.anfahrt) ? '' : el.dataset.anfahrt;
        render();
      };
    });
    document.getElementById('gotoToday').onclick = ()=> openDay(todayStr,'home');
  }

  if(state.screen==='day'){
    const ds = state.selectedDate;
    const d = getDay(ds);
    const dt = parseDstr(ds);
    document.getElementById('dayBack').onclick = ()=> setScreen(state.dayReturnScreen);
    document.getElementById('dayPrev').onclick = ()=>{
      const nd = parseDstr(state.selectedDate); nd.setDate(nd.getDate()-1);
      state.selectedDate = dstr(nd); render();
    };
    document.getElementById('dayNext').onclick = ()=>{
      const nd = parseDstr(state.selectedDate); nd.setDate(nd.getDate()+1);
      state.selectedDate = dstr(nd); render();
    };
    const hint = document.getElementById('saveHint');
    function flash(){ hint.textContent = 'gespeichert'; setTimeout(()=>{ if(hint) hint.textContent=''; },900); }

    document.getElementById('fKommen').onchange = e=>{ d.kommen = e.target.value||null; autoKategorisiereZeitausgleich(d, dt); flash(); render(); };
    document.getElementById('fGehen').onchange = e=>{ d.gehen = e.target.value||null; autoKategorisiereZeitausgleich(d, dt); flash(); render(); };
    document.getElementById('fPause').onchange = e=>{ d.pauseMin = Math.max(0, parseInt(e.target.value)||0); flash(); };
    document.getElementById('fKorrDez').onchange = ()=>{
      const dezVal = document.getElementById('fKorrDez').value;
      if(dezVal===''){ d.manuellerKorrekturwert = null; }
      else { d.manuellerKorrekturwert = Math.round(parseFloat(dezVal)*100); }
      render();
    };
    document.getElementById('fKorrSign').onclick = ()=>{
      const dezField = document.getElementById('fKorrDez');
      const cur = parseFloat(dezField.value) || 0;
      const flipped = -cur;
      dezField.value = flipped.toFixed(2);
      d.manuellerKorrekturwert = Math.round(flipped*100);
      render();
    };
    document.getElementById('fKorrClear').onclick = ()=>{ d.manuellerKorrekturwert = null; render(); };
    const dgBtn = document.getElementById('fDienstGeplant');
    if(dgBtn) dgBtn.onclick = ()=>{ d.dienstGeplant = !d.dienstGeplant; render(); };
    document.querySelectorAll('[data-danfahrt]').forEach(el=>{
      el.onclick = ()=>{ d.anfahrt = el.dataset.danfahrt; render(); };
    });
    document.getElementById('fVHmin').onchange = e=>{ d.verspHin.min = parseInt(e.target.value)||0; flash(); };
    document.getElementById('fVRmin').onchange = e=>{ d.verspRueck.min = parseInt(e.target.value)||0; flash(); };
    document.getElementById('fVHconf').onclick = ()=>{ d.verspHin.confirmed = !d.verspHin.confirmed; render(); };
    document.getElementById('fVRconf').onclick = ()=>{ d.verspRueck.confirmed = !d.verspRueck.confirmed; render(); };
    document.querySelectorAll('[data-kat]').forEach(el=>{
      el.onclick = ()=>{ d.kategorie = el.dataset.kat; render(); };
    });
    document.getElementById('fNotiz').onchange = e=>{ d.notiz = e.target.value; flash(); };
  }

  if(state.screen==='calendar'){
    document.getElementById('prevMonth').onclick = ()=>{
      state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} render();
    };
    document.getElementById('nextMonth').onclick = ()=>{
      state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} render();
    };
    document.querySelectorAll('[data-day]').forEach(el=>{
      el.onclick = ()=> openDay(el.dataset.day, 'calendar');
    });
  }

  if(state.screen==='stats'){
    document.querySelectorAll('[data-tab]').forEach(el=>{
      el.onclick = ()=>{ state.statsTab = el.dataset.tab; render(); };
    });
  }

  if(state.screen==='settings'){
    const hint = document.getElementById('settingsHint');
    function flash(){ hint.textContent='gespeichert'; setTimeout(()=>{ if(hint) hint.textContent=''; },900); }
    document.getElementById('fUmrStd').onchange = document.getElementById('fUmrMin').onchange = ()=>{
      const std = parseInt(document.getElementById('fUmrStd').value)||0;
      const min = Math.abs(parseInt(document.getElementById('fUmrMin').value)||0);
      const totalMin = std<0 ? -(Math.abs(std)*60+min) : (std*60+min);
      document.getElementById('fUmrDez').value = (totalMin/60).toFixed(2);
    };
    document.getElementById('fUmrDez').onchange = ()=>{
      const dez = parseFloat(document.getElementById('fUmrDez').value)||0;
      const totalMin = Math.round(dez*60);
      const neg = totalMin<0; const absMin = Math.abs(totalMin);
      document.getElementById('fUmrStd').value = (neg?-1:1)*Math.floor(absMin/60);
      document.getElementById('fUmrMin').value = absMin%60;
    };
    document.getElementById('fUmrBtn').onclick = ()=>{ document.getElementById('fUmrStd').onchange(); };
    document.getElementById('sMonatStd').onchange = ()=>{
      state.settings.monatsSoll = (parseInt(document.getElementById('sMonatStd').value)||0)*60; flash();
    };
    document.getElementById('sTshAdd').onclick = ()=>{
      const dateVal = document.getElementById('sTshDate').value;
      if(!dateVal){ alert('Bitte ein Datum wählen.'); return; }
      const minutes = stdMinToMinutes(document.getElementById('sTshStd').value, document.getElementById('sTshMin').value);
      if(!state.settings.tagesSollHistory) state.settings.tagesSollHistory = [];
      state.settings.tagesSollHistory = state.settings.tagesSollHistory.filter(h=>h.ab!==dateVal);
      state.settings.tagesSollHistory.push({ab:dateVal, min:minutes});
      state.settings.tagesSollHistory.sort((a,b)=> a.ab.localeCompare(b.ab));
      render();
    };
    document.querySelectorAll('[data-del-tsh]').forEach(el=>{
      el.onclick = ()=>{
        const idx = parseInt(el.dataset.delTsh);
        state.settings.tagesSollHistory.splice(idx,1);
        render();
      };
    });
    document.getElementById('sUrlaubDez').onchange = ()=>{
      state.settings.urlaubskontingent = Math.round(parseFloat(document.getElementById('sUrlaubDez').value)*60)||0; flash();
    };
    document.getElementById('sZeitsaldoMitnahmeDez').onchange = ()=>{
      state.settings.zeitsaldoMitnahme = Math.round(parseFloat(document.getElementById('sZeitsaldoMitnahmeDez').value)*60)||0; flash();
    };
    document.getElementById('sZeitsaldoMitnahmeSign').onclick = ()=>{
      const dezField = document.getElementById('sZeitsaldoMitnahmeDez');
      const cur = parseFloat(dezField.value) || 0;
      dezField.value = (-cur).toFixed(2);
      state.settings.zeitsaldoMitnahme = Math.round(-cur*60);
      flash();
    };
    document.getElementById('exportBtn').onclick = ()=>{
      const [y,m] = document.getElementById('exportMonat').value.split('-').map(Number);
      exportMonthReport(y,m);
    };
    document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = e=>{
      const f = e.target.files[0];
      if(f) importBackupFile(f);
      e.target.value = '';
    };
    document.getElementById('resetBtn').onclick = ()=>{
      if(confirm('Wirklich alle gespeicherten Daten unwiderruflich löschen?')){
        localStorage.removeItem(STORAGE_KEY);
        state.days = {};
        state.settings = {
          monatsSoll: 140*60, tagesSoll: 8*60, urlaubskontingent: 200*60,
          zeitsaldoMitnahme: 0,
          tagesSollHistory: [{ab:'2000-01-01', min:8*60}]
        };
        state.lastExport = null;
        render();
      }
    };
  }
}

/* ---------- Zeitraum-Export (nativer Druckdialog → "Als PDF speichern") ---------- */
function minToHHMMSigned(m){
  return (m>0?'+':'') + minToHHMM(m);
}
function stdMinToMinutes(stdVal, minVal){
  const std = parseInt(stdVal)||0;
  const min = Math.abs(parseInt(minVal)||0);
  return std<0 ? -(Math.abs(std)*60+min) : (std*60+min);
}
// Rot bei Minus, Grün bei Plus, Schwarz/neutral bei exakt 0 – nur für echte Saldo-Werte sinnvoll
function signClass(n){
  return n<0 ? 'neg' : (n>0 ? 'pos' : '');
}

/* Die erzeugte HTML-Datei enthält zusätzlich einen unsichtbaren <script>-Block
   mit den vollständigen Rohdaten (alle Tage, nicht nur der gewählte Zeitraum),
   damit dieselbe Datei bei Bedarf auch als Backup importiert werden kann. */
function exportMonthReport(y, m){
  const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  function verSpan(text, val){
    const color = val<0 ? '#c4432f' : (val>0 ? '#0e6f6a' : '#000');
    return '<span style="color:'+color+';">'+text+'</span>';
  }

  const arbeitstage = Object.entries(state.days).filter(([ds,dd])=>{
    const dt = parseDstr(ds);
    return dt.getFullYear()===y && dt.getMonth()===m && dd.kommen && dd.gehen;
  }).length;

  const prevM = m-1; // -1 = Stand vor Jahresbeginn (Mitnahme/Jahresbasis)
  const zsStand=standZeitsaldo(y,m),      zsVer=zsStand-standZeitsaldo(y,prevM);
  const urStand=standUrlaubRestVergangenheit(y,m), urVer=urStand-standUrlaubRestVergangenheit(y,prevM);
  const krStand=standKrankenstand(y,m),   krVer=krStand-standKrankenstand(y,prevM);
  const soStand=standSonderurlaub(y,m),   soVer=soStand-standSonderurlaub(y,prevM);
  const pkwStand=standPkwTage(y,m),       pkwVer=pkwStand-standPkwTage(y,prevM);
  const zvStand=standZugversp(y,m),       zvVer=zvStand-standZugversp(y,prevM);

  const statusRows = `<tr>
    <td>${arbeitstage}</td>
    <td>${minToHHMM(zsStand)} (${verSpan(minToHHMMSigned(zsVer), zsVer)})</td>
    <td>${minToHHMM(urStand)} (${verSpan(minToHHMMSigned(urVer), urVer)})</td>
    <td>${minToHHMM(krStand)} (${verSpan(minToHHMMSigned(krVer), krVer)})</td>
    <td>${minToHHMM(soStand)} (${verSpan(minToHHMMSigned(soVer), soVer)})</td>
    <td>${pkwStand} (${verSpan((pkwVer>0?'+':'')+pkwVer, pkwVer)})</td>
    <td>${minToHHMM(zvStand)} (${verSpan(minToHHMMSigned(zvVer), zvVer)})</td>
  </tr>`;

  const monthStart = new Date(y, m, 1);
  const monthEnd = new Date(y, m+1, 0);

  let dayRows = '';
  for(let cur=new Date(monthStart); cur<=monthEnd; cur.setDate(cur.getDate()+1)){
    const ds = dstr(cur);
    const d = state.days[ds];
    const kommen = (d && d.kommen) || '';
    const gehen = (d && d.gehen) || '';
    const anfahrt = d && d.anfahrt;
    const vH = d && d.verspHin;
    const vR = d && d.verspRueck;
    const kategorie = d && d.kategorie;
    const notiz = (d && d.notiz) || '';
    const unbooked = !(kommen || gehen || kategorie);
    const katCell = unbooked ? 'nicht gebucht' : (CAT_LABELS[kategorie]||'');
    const hasKorrektur = d && d.manuellerKorrekturwert!==null && d.manuellerKorrekturwert!==undefined;
    let waereAutomatischNichtPositiv = true;
    if(d && d.kommen && d.gehen){
      waereAutomatischNichtPositiv = (dayWorkedRawMinutes(d) - tagesSollFor(cur)) <= 0;
    }
    const manuellMark = (hasKorrektur && waereAutomatischNichtPositiv) ? ' [M]' : '';
    dayRows += `<tr>
      <td>${fmtDateLabel(ds)} ${ds}${manuellMark}</td>
      <td>${kommen}</td>
      <td>${gehen}</td>
      <td>${anfahrt==='pkw'?'PKW':anfahrt==='zug'?'Zug':''}</td>
      <td>${vH&&vH.min?vH.min+' Min'+(vH.confirmed?' ✓':' (unbest.)'):''}</td>
      <td>${vR&&vR.min?vR.min+' Min'+(vR.confirmed?' ✓':' (unbest.)'):''}</td>
      <td>${katCell}</td>
      <td>${notiz.replace(/</g,'&lt;')}</td>
    </tr>`;
  }

  const monthLabel = monthNames[m]+' '+y;

  const backupPayload = JSON.stringify({
    exportedAt: new Date().toISOString(),
    settings: state.settings,
    days: state.days
  });

  const html = `<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
  <title>Arbeitszeit-Export ${monthLabel}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif; color:#222; padding:20px; font-size:12px;}
    h1{font-size:17px; margin-bottom:2px;}
    h2{font-size:13px; margin-top:22px; border-bottom:1px solid #999; padding-bottom:4px;}
    table{width:100%; border-collapse:collapse; margin-top:8px;}
    th,td{border:1px solid #ccc; padding:4px 6px; text-align:left; font-size:10.5px;}
    th{background:#eee;}
    .note{font-size:9.5px; color:#888; margin-top:24px;}
  </style>
  </head><body>
    <h1>Arbeitszeitübersicht ${monthLabel}</h1>
    <div>Monats-Soll: ${minToHHMM(state.settings.monatsSoll)} · Tages-Soll: ${minToHHMM(tagesSollFor(new Date(y,m,1)))}</div>
    <div>Heruntergeladen am ${pad(new Date().getDate())}.${pad(new Date().getMonth()+1)}.${new Date().getFullYear()} um ${pad(new Date().getHours())}:${pad(new Date().getMinutes())} Uhr</div>

    <h2>Monats-Status</h2>
    <table style="font-size:10.5px;">
      <tr>
        <th>Arbeitstage</th>
        <th>Zeitsaldo</th>
        <th>Urlaub Rest</th>
        <th>Krankenstand</th>
        <th>Sonderurlaub</th>
        <th>PKW-Tage</th>
        <th>Zugversp.</th>
      </tr>
      ${statusRows}
    </table>
    <div class="note">1. Zahl = aktueller Stand · 2. Zahl in Klammern = Veränderung seit Monatsbeginn.</div>

    <h2>Tagesdetails</h2>
    <table>
      <tr><th>Datum</th><th>Kommen</th><th>Gehen</th><th>Anfahrt</th><th>Versp. Hin</th><th>Versp. Rück</th><th>Status/Kategorie</th><th>Notiz</th></tr>
      ${dayRows}
    </table>

    <div class="note">Diese Datei enthält zusätzlich vollständige, maschinenlesbare Backup-Daten (alle erfassten Tage) in einem unsichtbaren Block. Beim Drucken/PDF-Export erscheinen sie nicht. Original-HTML-Datei aufbewahren, falls Wiederherstellung nötig wird.</div>
  </body>
  <script type="application/json" id="arbeitszeit-backup">${backupPayload}<\/script>
  </html>`;

  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const fileLabel = y+'-'+pad(m+1);
  const filename = 'Arbeitszeit-Bericht-'+fileLabel+'.html';
  state.lastExport = { url, filename };

  // Erzeugen und Download in einem Schritt auslösen
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();

  render();
}

/* ---------- Backup-Import (liest eingebettetes JSON aus zuvor exportierter Datei) ---------- */
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const text = e.target.result;
      const match = text.match(/<script type="application\/json" id="arbeitszeit-backup">([\s\S]*?)<\/script>/);
      if(!match){
        alert('In dieser Datei wurden keine Backup-Daten gefunden. Bitte eine mit dieser App exportierte Berichts-Datei wählen.');
        return;
      }
      const data = JSON.parse(match[1]);
      if(!data || !data.days){
        alert('Ungültiges Backup-Format.');
        return;
      }
      const stamp = data.exportedAt ? new Date(data.exportedAt).toLocaleString('de-AT') : 'unbekanntem Zeitpunkt';
      const dayCount = Object.keys(data.days).length;
      if(confirm(dayCount+' Tag(e) aus dem Backup vom '+stamp+' werden übernommen und bestehende Einträge an denselben Datumswerten überschrieben. Alle anderen bereits vorhandenen Tage bleiben unverändert. Fortfahren?')){
        state.settings = Object.assign(state.settings, data.settings||{});
        Object.assign(state.days, data.days);
        render();
        alert(dayCount+' Tag(e) erfolgreich eingelesen.');
      }
    }catch(err){
      alert('Fehler beim Lesen der Datei: '+err.message);
    }
  };
  reader.readAsText(file);
}

document.querySelectorAll('#nav div').forEach(el=>{
  el.onclick = ()=> setScreen(el.dataset.nav);
});

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.log('Service Worker Registrierung fehlgeschlagen:', err));
  });
}
</script>
</body>
</html>
